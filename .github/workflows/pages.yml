name: Publish research to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build and validate public research
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python scripts/build.py
          python scripts/check.py
          node scripts/check-sort.cjs
          node scripts/check-analytics.cjs
      - name: Prepare only public files
        run: |
          mkdir _site
          cp index.html sitemap.xml .nojekyll LICENSE _site/
          cp -R data docs screenshots assets en _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
